<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}도서관 관리 시스템{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .sidebar {
            min-height: 100vh;
            background: #1e3a5f;
            color: #fff;
        }
        .sidebar .nav-link { color: rgba(255,255,255,.75); border-radius: 6px; margin: 2px 0; }
        .sidebar .nav-link:hover, .sidebar .nav-link.active { background: rgba(255,255,255,.15); color: #fff; }
        .sidebar .brand { font-size: 1.2rem; font-weight: 700; padding: 1.5rem 1rem; border-bottom: 1px solid rgba(255,255,255,.2); }
        .main-content { padding: 2rem; }
        .stat-card { border: none; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
        .badge-overdue { background-color: #dc3545; }
    </style>
</head>
<body>
<div class="d-flex">
    <!-- 사이드바 -->
    <nav class="sidebar d-flex flex-column p-3" style="width:220px; flex-shrink:0;">
        <div class="brand"><i class="bi bi-book-half me-2"></i>도서관 시스템</div>
        <ul class="nav flex-column mt-3 gap-1">
            <li class="nav-item">
                <a class="nav-link {% if request.endpoint == 'index' %}active{% endif %}" href="{{ url_for('index') }}">
                    <i class="bi bi-speedometer2 me-2"></i>대시보드
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link {% if 'book' in request.endpoint %}active{% endif %}" href="{{ url_for('books') }}">
                    <i class="bi bi-journals me-2"></i>도서 관리
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link {% if 'member' in request.endpoint %}active{% endif %}" href="{{ url_for('members') }}">
                    <i class="bi bi-people me-2"></i>회원 관리
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link {% if 'loan' in request.endpoint %}active{% endif %}" href="{{ url_for('loans') }}">
                    <i class="bi bi-arrow-left-right me-2"></i>대출/반납
                </a>
            </li>
        </ul>
    </nav>

    <!-- 메인 콘텐츠 -->
    <div class="flex-grow-1 main-content">
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
        <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        {% endfor %}
        {% endwith %}

        {% block content %}{% endblock %}
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
