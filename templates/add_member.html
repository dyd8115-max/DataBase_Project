{% extends "base.html" %}
{% block title %}회원 등록{% endblock %}
{% block content %}
<div class="d-flex align-items-center mb-4 gap-3">
    <a href="{{ url_for('members') }}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left"></i></a>
    <h4 class="fw-bold mb-0">회원 등록</h4>
</div>
<div class="card border-0 shadow-sm" style="max-width:480px;">
    <div class="card-body">
        <form method="post">
            <div class="mb-3">
                <label class="form-label fw-semibold">이름 <span class="text-danger">*</span></label>
                <input type="text" name="name" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">이메일 <span class="text-danger">*</span></label>
                <input type="email" name="email" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">전화번호</label>
                <input type="text" name="phone" class="form-control" placeholder="010-0000-0000">
            </div>
            <button type="submit" class="btn btn-primary w-100">등록</button>
        </form>
    </div>
</div>
{% endblock %}
